<h2 mat-dialog-title class="form-header">
  {{ headerText() }}
</h2>

<mat-dialog-content>
  @if (config()) {
    <!-- The submit button lives in mat-dialog-actions, wired back here by id. -->
    <form id="entityForm" (ngSubmit)="onSubmit()">
      @for (field of visibleFields(); track field) {
        <div class="form-group">
          <label [for]="field.key">{{ ('field.' + field.key) | translate }}</label>
          <input [id]="field.key" class="form-control" [(ngModel)]="entity[field.key]" [name]="field.key"
            [readonly]="field.readonly || false" [type]="field.type || 'text'"
            [required]="field.required || false" />
          @if (errors()[field.key]) {
            <span class="text-danger">{{ errors()[field.key] }}</span>
          }
        </div>
      }
    </form>
  }

  @if (errorMessage()) {
    <div class="alert alert-danger">
      {{ errorMessage() }}
    </div>
  }
</mat-dialog-content>

<mat-dialog-actions class="button-group">
  <button type="button" class="btn btn-outline-primary" mat-dialog-close>
    {{ 'common.cancel' | translate }}
  </button>
  <button type="submit" form="entityForm" class="btn btn-primary">
    {{ (mode() === 'create' ? 'common.create' : 'common.update') | translate }}
  </button>
</mat-dialog-actions>
